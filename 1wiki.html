const viewContainer = document.getElementById('viewContainer');

function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightText(text, query) {
    if (!query || !query.trim()) return escapeHtml(text);
    const q = query.trim();
    const re = new RegExp(`(${escapeRegExp(q)})`, 'gi');
    return escapeHtml(text).replace(re, '<span class="highlight">$1</span>');
}
function excerpt(text, n = 64) {
    return text.length > n ? text.slice(0, n) + '…' : text;
}


function getMatchScore(entry, query) {
    const q = query.trim().toLowerCase();
    if (!q) return 0;
    let score = 0;
    if (entry.title.toLowerCase().includes(q)) score += 100;
    if (entry.keywords.some(kw => kw.toLowerCase().includes(q))) score += 50;
    if (entry.body.toLowerCase().includes(q)) score += 20;
    return score;
}
function filterAndSortEntries(query) {
    const q = query.trim();
    if (!q) return [...entries];
    return entries
        .map(entry => ({ entry, score: getMatchScore(entry, q) }))
        .filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score)
        .map(item => item.entry);
}

    document.title = '崇实2025级1班· 百科WIKI';

    const filtered = filterAndSortEntries(currentQuery);
    const q = currentQuery.trim();

    viewContainer.innerHTML = `
        <div class="home-view">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜梗、搜关键字、搜正文..."
                           autocomplete="off" value="${escapeHtml(currentQuery)}">
                    <button id="searchBtn">🔍 搜索</button>
                </div>
                <div class="search-hint">站长:fengxing2202</div>
            </div>

            <div class="status-bar">
                <span id="resultCount">共 ${filtered.length} 个词条${q ? `（搜索「${escapeHtml(q)}」）` : ''}</span>
                <button class="clear-search" id="clearSearchBtn">清除搜索</button>
            </div>

            <div class="wiki-grid" id="wikiGrid"></div>
        </div>
    `;

    const grid = document.getElementById('wikiGrid');

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">😶 没有找到匹配的词条<br>也许你应该试试别的？</div>`;
        return;
    }

    grid.innerHTML = filtered.map(entry => {
        const titleHtml = q ? highlightText(entry.title, q) : escapeHtml(entry.title);
        const bodyHtml  = q ? highlightText(entry.body, q)  : escapeHtml(entry.body);
        const kwHtml = entry.keywords.map(kw =>
            `<span class="keyword-badge clickable" data-search-term="${escapeHtml(kw)}">${
                q ? highlightText(kw, q) : escapeHtml(kw)
            }</span>`
        ).join('');
        const relHtml = entry.related.map(title => relatedLinkHtml(title)).join('');

        return `
            <article class="entry-card">
                <h3 class="entry-title">
                    <span class="pin">📌</span>
                    <a class="entry-link" href="#/entry/${entry.id}">${titleHtml}</a>
                </h3>
                <div class="entry-body">${bodyHtml}</div>
                <div class="entry-keywords">${kwHtml}</div>
                <div class="related-links">
                    <span class="related-label">🔗 关联：</span>
                    ${relHtml || '<span style="color:#b7aa9b;">暂无</span>'}
                </div>
                <a class="read-more" href="#/entry/${entry.id}">阅读全文 →</a>
            </article>
        `;
    }).join('');
}


function relatedLinkHtml(title) {
    const target = entries.find(e => e.title === title);
    if (target) {
        return `<a class="related-link" href="#/entry/${target.id}">${escapeHtml(title)}</a>`;
    }
    return `<span class="related-link missing" data-search-term="${escapeHtml(title)}">${escapeHtml(title)}</span>`;
}


function renderDetail(id) {
    const entry = entries.find(e => e.id === id);

    if (!entry) {
        renderNotFound(id);
        return;
    }

    document.title = `${entry.title} · 崇实2025级1班百科`;

    const idx = entries.findIndex(e => e.id === id);
    const prev = idx > 0 ? entries[idx - 1] : null;
    const next = idx < entries.length - 1 ? entries[idx + 1] : null;

    const forward = entry.related
        .map(title => entries.find(e => e.title === title))
        .filter(Boolean);
    const backward = entries.filter(e => e.id !== entry.id && e.related.includes(entry.title));

    const seen = new Set([entry.id]);
    const relatedList = [];
    [...forward, ...backward].forEach(e => {
        if (!seen.has(e.id)) { seen.add(e.id); relatedList.push(e); }
    });

    const relatedHtml = relatedList.length
        ? `<div class="related-grid">${relatedList.map(e => `
                <a class="related-item" href="#/entry/${e.id}">
                    <div class="related-item-title">${escapeHtml(e.title)}</div>
                    <div class="related-item-desc">${escapeHtml(excerpt(e.body, 58))}</div>
                </a>`).join('')}</div>`
        : `<div class="related-empty">暂无关联词条</div>`;

    const keywordsHtml = entry.keywords.map(kw =>
        `<span class="keyword-badge clickable" data-search-term="${escapeHtml(kw)}">${escapeHtml(kw)}</span>`
    ).join('');

    viewContainer.innerHTML = `
        <div class="detail-view">
            <a class="back-home" href="#/">← 返回词条列表</a>

            <article class="detail-card">
                <h1 class="detail-title">
                    <span class="pin">📌</span>
                    <span>${escapeHtml(entry.title)}</span>
                </h1>
                <div class="detail-meta">词条编号 ${entry.id.toUpperCase()} · 正文 ${entry.body.length} 字 · ${entry.keywords.length} 个关键字</div>

                <div class="detail-body">${escapeHtml(entry.body)}</div>

                <div class="detail-keywords">
                    <span class="section-label">关键字：</span>
                    ${keywordsHtml || '<span style="color:#b7aa9b;">无</span>'}
                </div>

                <h2 class="section-title">🔗 关联词条</h2>
                ${relatedHtml}
            </article>

            <nav class="prev-next">
                ${prev
                    ? `<a href="#/entry/${prev.id}"><span class="nav-label">← 上一个词条</span><span class="nav-title">${escapeHtml(prev.title)}</span></a>`
                    : `<span class="placeholder"></span>`}
                ${next
                    ? `<a class="next" href="#/entry/${next.id}"><span class="nav-label">下一个词条 →</span><span class="nav-title">${escapeHtml(next.title)}</span></a>`
                    : `<span class="placeholder"></span>`}
            </nav>
        </div>
    `;
}


function renderNotFound(id) {
    document.title = '词条不存在 · 崇实2025级1班百科';
    viewContainer.innerHTML = `
        <div class="not-found">
            <h2> 没有找到这个词条</h2>
            <p>编号「${escapeHtml(id)}」不存在，可能链接已失效或词条尚未收录</p>
            <p style="margin-top:1.4rem;">
                <a class="back-home" href="#/">← 返回词条列表</a>
            </p>
        </div>
    `;
}


function router() {
    const hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));

    if (hash.startsWith('/entry/')) {
        renderDetail(hash.slice('/entry/'.length));
    } else {
        renderHome();
    }
    window.scrollTo({ top: 0, behavior: 'auto' });
}


function doSearch(query) {
    currentQuery = query;
    const hash = window.location.hash;
    if (hash && hash !== '#/' && hash !== '#') {
        window.location.hash = '#/';   // 触发 hashchange → router → renderHome
    } else {
        renderHome();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}




viewContainer.addEventListener('compositionstart', (e) => {
    if (e.target && e.target.id === 'searchInput') {
        isComposing = true;
        clearTimeout(debounceTimer);   // 取消可能存在的防抖
    }
}, true);  
viewContainer.addEventListener('compositionend', (e) => {
    if (e.target && e.target.id === 'searchInput') {
        isComposing = false;
       
        const val = e.target.value;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            if (val !== currentQuery) doSearch(val);
        }, 80);
    }
}, true);


viewContainer.addEventListener('click', (e) => {
    if (e.target.closest('#searchBtn')) {
        const input = document.getElementById('searchInput');
        doSearch(input ? input.value : '');
        return;
    }
    if (e.target.closest('#clearSearchBtn')) {
        doSearch('');
        return;
    }
    const searchTermEl = e.target.closest('[data-search-term]');
    if (searchTermEl) {
        e.preventDefault();
        doSearch(searchTermEl.dataset.searchTerm);
    }
});


viewContainer.addEventListener('keydown', (e) => {
    if (e.target.id === 'searchInput' && e.key === 'Enter') {
        if (isComposing || e.isComposing || e.keyCode === 229) return;  
        e.preventDefault();
        clearTimeout(debounceTimer);
        doSearch(e.target.value);
    }
});


viewContainer.addEventListener('input', (e) => {
    if (e.target.id !== 'searchInput') return;
    if (isComposing || e.isComposing) return;   

    clearTimeout(debounceTimer);
    const val = e.target.value;
    debounceTimer = setTimeout(() => {
        if (val !== currentQuery) doSearch(val);
    }, 300);
});


window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
